[package]
name = "xssearch"
version = "0.1.8"
edition = "2021"
description = "Advanced XSS detection tool"
authors = ["Fabian Affolter <fabian@affolter-engineering.ch>"]
license = "MIT"
repository = "https://github.com/affolter-engineering/xssearch"
homepage = "https://github.com/affolter-engineering/xssearch"
keywords = ["xss", "security", "pentesting", "web", "scanner"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
rust-version = "1.75"

[[bin]]
name = "xssearch"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls"] }
clap = { version = "4", features = ["derive", "color"] }
scraper = "0.20"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
url = "2"
indicatif = "0.17"
anyhow = "1"
rand = "0.8"
base64 = "0.22"
html-escape = "0.2"
futures = "0.3"
tokio-stream = "0.1"
